name: plantilla_tfg
description: "Simulador Biomecanico"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.31.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.4
  share_plus: ^10.1.3
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/mesh-bg.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"